spring.application.name=wallet-ledger-service

# Default profile: in-memory H2, no setup needed. Use the "mysql" profile for MySQL.
spring.datasource.url=jdbc:h2:mem:wallet;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=20000
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
